# Server Configuration for Render
server.port=${PORT:8080}
spring.application.name=makerspace-backend

# Flyway Configuration for Database Migrations
# Force Flyway to run migrations on startup
spring.flyway.url=jdbc:${DATABASE_URL}
spring.flyway.user=${DATABASE_USERNAME}
spring.flyway.password=${DATABASE_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# Database Configuration for Render PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration from Render Environment
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration for Vercel Frontend
spring.web.cors.allowed-origins=${FRONTEND_URL:https://your-app.vercel.app}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# File Upload Configuration for Render (Free Tier)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:/tmp/uploads}

# Actuator Configuration for Render Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Flyway Configuration for Database Migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true